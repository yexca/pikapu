name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: pikapu

jobs:
  verify_release:
    name: Verify release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag and version
        shell: bash
        run: |
          expected_version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $expected_version." >&2
            exit 1
          fi

      - name: Verify release notes
        shell: bash
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi

      # Fail before any build if the push job could not log in to Docker Hub.
      - name: Verify registry credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "The DOCKERHUB_TOKEN secret is required to push the image to Docker Hub." >&2
            exit 1
          fi

      - name: Wait for successful main CI for this commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100"
          deadline=$((SECONDS + 1800))

          while true; do
            # The single-quoted program contains jq variables, not shell variables.
            # shellcheck disable=SC2016
            state="$(gh api "$runs_api" --jq '
              [.workflow_runs[] | select(.head_branch == "main")] as $runs
              | if any($runs[]; .status == "completed" and .conclusion == "success") then "success"
                elif any($runs[]; .status != "completed") then "waiting"
                elif ($runs | length) > 0 then "failed"
                else "missing"
                end
            ')"

            case "$state" in
              success)
                echo "Successful main CI found for commit $GITHUB_SHA."
                break
                ;;
              failed)
                echo "Main CI failed for commit $GITHUB_SHA:" >&2
                gh api "$runs_api" --jq '
                  .workflow_runs[]
                  | select(.head_branch == "main")
                  | "\(.html_url) status=\(.status) conclusion=\(.conclusion)"
                ' >&2
                exit 1
                ;;
              waiting)
                echo "Main CI for commit $GITHUB_SHA is still running; checking again in 60 seconds."
                ;;
              missing)
                echo "Main CI for commit $GITHUB_SHA is not visible yet; checking again in 60 seconds."
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for successful main CI for commit $GITHUB_SHA." >&2
              exit 1
            fi
            sleep 60
          done

  build_image:
    name: Build image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - verify_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build without pushing so a broken image stops the release before any
      # registry tag moves. The push job reuses this cache.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-to: type=gha,scope=release-image,mode=max

  draft_release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - build_image

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The release stays a draft until the image is pushed, so the release
      # page never points at tags that do not exist yet.
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi

  push_image:
    name: Push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs:
      - draft_release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Pikapu
            org.opencontainers.image.description=Single-user, self-hosted RSS reader

      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          provenance: mode=max
          sbom: true

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - push_image

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
